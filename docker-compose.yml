# Local serving stack: MLflow (Postgres backend) + scoring API.
#   docker compose up -d --build
#   MLflow UI -> http://localhost:5000   API docs -> http://localhost:8000/docs

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      retries: 10

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://mlflow:mlflow@postgres:5432/mlflow
      --artifacts-destination /mlartifacts
      --allowed-hosts mlflow:5000,localhost:5000,127.0.0.1:5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow-artifacts:/mlartifacts
    depends_on:
      postgres:
        condition: service_healthy
    # The API loads its model once at startup, so it must not start before MLflow answers
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build: .
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_URI: ${MODEL_URI:-models:/fraud-detection@champion}
      # empty = use the threshold stored with the model
      FRAUD_THRESHOLD: ${FRAUD_THRESHOLD:-}
      # Worker processes: about one per core given to the container (scoring is CPU-bound)
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      # > 0 turns on micro-batching of /predict (e.g. 2 ms); 0 = off
      MICROBATCH_WAIT_MS: ${MICROBATCH_WAIT_MS:-0}
      MICROBATCH_MAX_SIZE: ${MICROBATCH_MAX_SIZE:-64}
    ports:
      - "8000:8000"
    depends_on:
      mlflow:
        condition: service_healthy

volumes:
  postgres-data:
  mlflow-artifacts:
