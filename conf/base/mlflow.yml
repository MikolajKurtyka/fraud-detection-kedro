# kedro-mlflow configuration. Defaults to a local SQLite store (./mlflow.db, artifacts in ./mlruns);
# set MLFLOW_TRACKING_URI (e.g. http://localhost:5000 from docker compose) to use the server.
server:
  mlflow_tracking_uri: ${oc.env:MLFLOW_TRACKING_URI,"sqlite:///mlflow.db"}

tracking:
  experiment:
    name: fraud-detection
    create_experiment_kwargs:
      # MLflow 3 UI: show the classic runs table (metrics, params, compare) instead of
      # the GenAI traces view. Applied when the experiment is first created.
      tags:
        mlflow.experimentKind: custom_model_development
  params:
    long_params_strategy: truncate
