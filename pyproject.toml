[project]
name = "fraud-detection-kedro"
version = "0.1.0"
description = "Real-time card fraud scoring on IEEE-CIS data: Kedro pipelines, MLflow registry, FastAPI serving."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "kedro>=1.0,<2.0",
    "kedro-datasets[pandas-csvdataset,pandas-parquetdataset]>=5.0",
    "kedro-mlflow>=1.0",
    "mlflow>=2.17",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "pandera>=0.20",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "optuna>=4.0",
    "shap>=0.46",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "kaggle>=1.7",
    "kedro-viz>=10.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_detection"]

[project.scripts]
fraud-detection = "fraud_detection.__main__:main"

[tool.kedro]
package_name = "fraud_detection"
project_name = "fraud-detection-kedro"
kedro_init_version = "1.0.0"
source_dir = "src"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
